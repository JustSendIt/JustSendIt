<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Get your ticket — Just Send It 🎟️</title>
<!-- The door is no longer a page. It used to be: every signed-out visitor, and every crawler, was
     redirected here, which closed the landing page and made every canonical, sitemap entry and og: tag
     on the site unreachable. The invite now opens as a modal over whatever page someone is on, at the
     moment they try to JOIN — reading is open to everyone. This file stays only so links and bookmarks
     that were handed out still land somewhere useful, and it tells search engines where the real page is. -->
<meta name="robots" content="noindex, follow">
<link rel="canonical" href="https://sendrh.com/">
<meta http-equiv="refresh" content="0; url=/?invite=1">
<link rel="icon" href="/assets/logo-128.png">
<style>
  html, body { margin: 0; height: 100%; background: #070312; color: #f2eaff;
               font-family: 'Rubik', system-ui, -apple-system, 'Segoe UI', sans-serif; }
  main { min-height: 100%; display: grid; place-items: center; text-align: center; padding: 2rem 1rem; gap: 0.6rem; }
  h1 { font-size: 1.5rem; margin: 0; }
  p { margin: 0; color: #b9a8dd; }
  a { color: #b4ff2b; font-weight: 700; }
</style>
</head>
<body>
<main>
  <div>
    <h1>🎟️ Your ticket moved</h1>
    <p>Taking you to the site — the invite opens there.</p>
    <p style="margin-top:0.8rem;"><a href="/?invite=1">Continue to Just Send It →</a></p>
  </div>
</main>
<script src="/gate-redirect.js"></script>
</body>
</html>
